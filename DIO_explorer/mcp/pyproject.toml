[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dio-explorer-mcp"
version = "1.0.0"
description = "Servidor MCP do DIO Explorer — expõe trilhas, desafios e certificados via protocolo MCP"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }

dependencies = [
    "mcp[cli]>=1.9.0",
]

[project.scripts]
dio-explorer-mcp = "server:mcp"

[tool.hatch.build.targets.wheel]
packages = ["."]

[project.optional-dependencies]
dev = ["pytest", "pytest-asyncio"]
